[project]
name = "dasales"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevPhilosopher", email = "woobaeldaw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.6",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
dasales = "dasales:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
